# Global config for the M-Agent-Orchestra orchestrator.
# Read once at startup (see orchestrator_config.load_config); keys not
# listed here fall back to the defaults in orchestrator_config.py.
# server.host / server.port / env.name can be overridden per run with
# --host / --port / --env.

server:
  host: 127.0.0.1
  port: 50051

env:
  # Which env plugin async_act_client loads (env_plugins/<name>.py).
  name: minigrid

orchestrator:
  # Size x of the shared observation queue: only the x most recent
  # observations (from the agent, the user or a reset) stay in memory.
  obs_buffer_size: 512

storage:
  # Where record batches are written: storage/<mode>.py decides the
  # medium (filesystem today; e.g. s3 tomorrow), the batching below is
  # the same for every backend.
  mode: filesystem

  # Every batch_size records pushed to the obs buffer, one batch of
  # that size is written to disk; an episode boundary (terminated step
  # or a reset) flushes the pending records early, so a batch never
  # spans two episodes. Meant as a subdivision of obs_buffer_size; a
  # mismatch is warned about, not rejected.
  batch_size: 64

  # Backend-dependent destination, default <project root>/records. A
  # relative path resolves against the working directory.
  # path: /absolute/or/relative/destination

agent:
  # Think time of the placeholder policy, in seconds. Once a real agent
  # service replaces the stub, its own latency takes over.
  think_time: 1
